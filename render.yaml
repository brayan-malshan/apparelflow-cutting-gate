# Render Blueprint. A persistent disk requires a paid instance type (starter or above);
# on the free plan the disk is wiped on every restart/redeploy, which would lose all orders.
services:
  - type: web
    name: apparelflow-cutting-gate
    runtime: node
    plan: starter
    buildCommand: npm install && npm install --prefix client && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_FILE
        value: /var/data/apparelflow.db
    disk:
      name: apparelflow-data
      mountPath: /var/data
      sizeGB: 1
