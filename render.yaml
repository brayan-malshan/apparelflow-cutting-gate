# Free-plan Render Blueprint. The free plan has no persistent disk, so the SQLite
# database lives on ephemeral storage and resets when the instance restarts.
services:
  - type: web
    name: apparelflow-cutting-gate
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix client && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true